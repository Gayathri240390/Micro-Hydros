[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -D USE_SIMULATED_SENSORS=1
lib_deps =
    knolleary/PubSubClient@^2.8

[env:native]
platform = native
build_flags =
    -std=c++17
    -Iinclude
build_src_filter = +<validator.cpp>
test_framework = unity
test_build_src = yes
test_filter = test_validator